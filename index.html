<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="./script.js" defer></script>
</head>

<body>
    <h1>Calculator</h1>
    <p>Calculation made easy</p>

    <main class="calculator__wrapper">
        <div class="calculator__box">
        <!-- calculator display -->
        <section class="display__box">
            <label for="input"></label>
            <input type="text" name="input" id="input" placeholder="0" readonly>
        </section>

        <section class=" btns__wrapper">
            <!-- 0-9 number button -->
            <section class="number__box">
                <button class=" number__btn">1</button>
                <button class=" number__btn">2</button>
                <button class=" number__btn">3</button>
                <button class=" number__btn">4</button>
                <button class=" number__btn">5</button>
                <button class=" number__btn">6</button>
                <button class=" number__btn">7</button>
                <button class=" number__btn">8</button>
                <button class=" number__btn">9</button>
                <button class=" number__btn">0</button>
                <button class=" number__btn">&sdot;</button>
            </section>

            <!-- Operators button -->
            <Section class="operators__box">
                <button class="operator__btn">&plus;</button>
                <button class="operator__btn">&minus;</button>
                <button class="operator__btn">&times;</button>
                <button class="operator__btn">&divide;</button>
                <button class="operator__btn">&equals;</button>
                <button class="operator__btn">Clear</button>
            </Section>
        </section>
        </div>
    </main>
</body>

</html>
